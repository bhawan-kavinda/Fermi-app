<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#C4141C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C4141C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C4141C"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C4141C" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#07070B"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- top sprocket rail -->
  <g fill="#1C1C24">
    <rect x="0" y="14" width="1200" height="10" fill="none"/>
  </g>
  <g fill="#232330">
    <!-- sprocket holes -->
    <g id="holesTop">
      <rect x="20" y="10" width="18" height="12" rx="3"/>
      <rect x="68" y="10" width="18" height="12" rx="3"/>
      <rect x="116" y="10" width="18" height="12" rx="3"/>
      <rect x="164" y="10" width="18" height="12" rx="3"/>
      <rect x="212" y="10" width="18" height="12" rx="3"/>
      <rect x="260" y="10" width="18" height="12" rx="3"/>
      <rect x="308" y="10" width="18" height="12" rx="3"/>
      <rect x="356" y="10" width="18" height="12" rx="3"/>
      <rect x="404" y="10" width="18" height="12" rx="3"/>
      <rect x="452" y="10" width="18" height="12" rx="3"/>
      <rect x="500" y="10" width="18" height="12" rx="3"/>
      <rect x="548" y="10" width="18" height="12" rx="3"/>
      <rect x="596" y="10" width="18" height="12" rx="3"/>
      <rect x="644" y="10" width="18" height="12" rx="3"/>
      <rect x="692" y="10" width="18" height="12" rx="3"/>
      <rect x="740" y="10" width="18" height="12" rx="3"/>
      <rect x="788" y="10" width="18" height="12" rx="3"/>
      <rect x="836" y="10" width="18" height="12" rx="3"/>
      <rect x="884" y="10" width="18" height="12" rx="3"/>
      <rect x="932" y="10" width="18" height="12" rx="3"/>
      <rect x="980" y="10" width="18" height="12" rx="3"/>
      <rect x="1028" y="10" width="18" height="12" rx="3"/>
      <rect x="1076" y="10" width="18" height="12" rx="3"/>
      <rect x="1124" y="10" width="18" height="12" rx="3"/>
      <rect x="1162" y="10" width="18" height="12" rx="3"/>
    </g>
    <use href="#holesTop" y="286"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="90" font-family="DM Mono, Menlo, monospace" font-size="14" letter-spacing="6" fill="#8A8A94" text-anchor="middle">CASE STUDY</text>

  <!-- title -->
  <text x="600" y="180" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="96" letter-spacing="14" fill="url(#titleGrad)" text-anchor="middle">FERMI</text>

  <!-- accent rule -->
  <rect x="520" y="205" width="160" height="3" rx="1.5" fill="url(#railGrad)"/>

  <!-- tagline -->
  <text x="600" y="245" font-family="Playfair Display, Georgia, serif" font-style="italic" font-size="22" fill="#B9B7C0" text-anchor="middle">Every frame, remembered.</text>

  <text x="600" y="278" font-family="DM Sans, Helvetica, sans-serif" font-size="14" fill="#6E6E7A" text-anchor="middle">A solo-built, phone-only, AI-assisted media app</text>
</svg>
